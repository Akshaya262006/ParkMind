name: PARKSENSE CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin/react-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  backend-check:
    name: Backend Python Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          grep -Ev '^(pywin32|pypiwin32|pywinpty|pywinpty3|comtypes|PyGetWindow|PyMsgBox|PyRect|PyScreeze|PyAutoGUI|pynput|pytweening|mouseinfo|pyperclip|pyobjc[^=]*)==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Check Python syntax
        working-directory: backend
        run: python -m compileall -q .